<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ViPlayer mark: a glass tile with a "V" whose right arm becomes
       equalizer bars. Kept inside the central 66 % (Android adaptive-icon
       safe zone). -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D9E8FF"/>
    </linearGradient>
  </defs>
  <rect x="272" y="272" width="480" height="480" rx="120"
        fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="6"/>
  <g fill="none" stroke="url(#mark)" stroke-linecap="round" stroke-linejoin="round" stroke-width="50">
    <path d="M362 408 L442 616"/>
    <path d="M442 616 L496 476"/>
  </g>
  <!-- equalizer -->
  <g fill="url(#mark)">
    <rect x="532" y="516" width="38" height="100" rx="19"/>
    <rect x="592" y="400" width="38" height="216" rx="19" fill-opacity="0.9"/>
    <rect x="652" y="468" width="38" height="148" rx="19" fill-opacity="0.75"/>
  </g>
</svg>
